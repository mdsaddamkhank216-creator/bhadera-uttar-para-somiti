<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>সদস্য ড্যাশবোর্ড | ভাদেরা উত্তর পাড়া সমিতি</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #00000015;
    }

    h2 {
      text-align: center;
      color: #166534;
    }

    .info {
      background: #f0fdf4;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      border: none;
      border-radius: 6px;
      background: #dc2626;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #message {
      text-align: center;
      color: #166534;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>ভাদেরা উত্তর পাড়া সমিতি</h2>

    <p id="message">আপনার তথ্য যাচাই করা হচ্ছে...</p>

    <div class="info">
      <p>
        <strong>সদস্যের নাম:</strong>
        <span id="memberName">—</span>
      </p>

      <p>
        <strong>মোবাইল নম্বর:</strong>
        <span id="memberPhone">—</span>
      </p>

      <p>
        <strong>সদস্যের অবস্থা:</strong>
        <span id="memberStatus">—</span>
      </p>
    </div>

    <button id="logoutButton">লগআউট</button>
  </div>

  <script type="module">
    import { auth, db } from "./firebase.js";

    import {
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

    import {
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    const message = document.getElementById("message");

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      try {
        const memberRef = doc(db, "members", user.uid);
        const memberSnap = await getDoc(memberRef);

        if (!memberSnap.exists()) {
          await signOut(auth);
          window.location.href = "login.html";
          return;
        }

        const memberData = memberSnap.data();

        if (memberData.status !== "approved") {
          await signOut(auth);

          alert("আপনার সদস্যপদ এখনো অনুমোদিত হয়নি।");

          window.location.href = "login.html";
          return;
        }

        document.getElementById("memberName").textContent =
          memberData.name || "নাম পাওয়া যায়নি";

        document.getElementById("memberPhone").textContent =
          memberData.phone || "নম্বর পাওয়া যায়নি";

        document.getElementById("memberStatus").textContent =
          "অনুমোদিত";

        message.textContent =
          "স্বাগতম! আপনার সদস্য ড্যাশবোর্ড প্রস্তুত।";

      } catch (error) {
        console.error(error);

        message.textContent =
          "তথ্য লোড করা যায়নি। আবার চেষ্টা করুন।";
      }
    });

    document.getElementById("logoutButton")
      .addEventListener("click", async () => {
        await signOut(auth);
        window.location.href = "login.html";
      });
  </script>

</body>
</html>
